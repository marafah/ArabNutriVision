services:
  - type: web
    name: arabnutrivision
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --no-input && python manage.py load_reference_data && python manage.py seed_demo && python manage.py ensure_admin && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ANV_ADMIN_USERNAME
        value: marafah
      - key: ANV_ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
